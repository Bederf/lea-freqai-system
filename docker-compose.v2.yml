---
services:
  freqtrade-v2:
    image: freqtradeorg/freqtrade:stable_freqaitorch
    restart: unless-stopped
    container_name: freqtrade-v2
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8082:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_v2.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_v2.sqlite
      --config /freqtrade/user_data/configs/config_v2_05tp.json
      --strategy LeaFreqAIStrategy
      --freqaimodel XGBoostRegressor
