---
services:
  freqtrade-chronos:
    image: freqtradeorg/freqtrade:stable_freqaitorch
    restart: unless-stopped
    container_name: freqtrade-chronos
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "0.0.0.0:8088:8080"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install chronos-forecasting --quiet 2>&1 | tail -2
        echo "Chronos installed. Starting Freqtrade..."
        freqtrade trade \
          --logfile /freqtrade/user_data/logs/freqtrade_chronos.log \
          --db-url sqlite:////freqtrade/user_data/tradesv3_chronos.sqlite \
          --config /freqtrade/user_data/configs/config_chronos.json \
          --strategy ChronosStrategy
